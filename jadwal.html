<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Operasional</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #eee;
    padding: 20px;
    text-align: center;
  }
  .box {
    background: #fff;
    max-width: 350px;
    margin: auto;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  img { width: 100px; }
  .nav {
    font-size: 14px;
    margin: 10px 0;
  }
  .nav a {
    color: #6a1b9a;
    text-decoration: underline;
  }
  .nav span {
    color: #6a1b9a;
    text-decoration: underline;
  }
  hr { border: 0; border-top: 1px solid #ccc; margin: 15px 0; }
  h1 { font-size: 20px; font-weight: normal; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #333;
    padding: 10px;
    text-align: left;
    font-size: 14px;
  }
  .italic { font-style: italic; }
  .footer { font-size: 12px; color: #777; margin-top: 15px; }
</style>
</head>
<body>

<div class="box">
  <img src="logo.jpg">
  
  <div class="nav">
    <a href="index.html">Beranda</a> | 
    <span>Jadwal Operasional</span>
  </div>
  <hr>
  
  <h1>Jam Operasional Kedai</h1>
  
  <table>
    <tr>
      <th>Hari</th>
      <th>Jam Buka</th>
    </tr>
    <tr>
      <td>Senin - Jumat</td>
      <td>09.00 - 22.00</td>
    </tr>
    <tr>
      <td>Sabtu - Minggu</td>
      <td>10.00 - 23.00</td>
    </tr>
    <tr>
      <td colspan="2" class="italic">Format waktu dalam WIB</td>
    </tr>
  </table>
  
  <div class="footer">Created by Arief @2026</div>
</div>

</body>
</html>
